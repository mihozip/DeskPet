name: Feature request
description: Propose an improvement to DeskPet
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / workflow gap
      description: What real workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: writes
    attributes:
      label: Does this change write to an external system?
      options:
        - No
        - Calendar / Reminders
        - Google Apps Script
        - Other
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy / permission considerations
