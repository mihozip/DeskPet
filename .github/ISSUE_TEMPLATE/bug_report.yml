name: Bug report
description: Report a reproducible DeskPet problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, GAS tokens, private Gateway URLs, Spreadsheet IDs, or private Inbox / Diary content.
  - type: input
    id: version
    attributes:
      label: DeskPet version
      placeholder: 0.9.1.2
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove private URLs, IDs, names and work content before posting.
