name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Public repository checks
        run: ./script/check_public_repo.sh

      - name: Validate GAS Gateway contract
        run: |
          node --check GAS/DeskPet_GAS_API_Gateway_v3.js
          node tests/gateway_contract.test.js

      - name: Validate shell scripts
        run: |
          bash -n script/build_and_run.sh
          bash -n script/build_release.sh
          bash -n script/install_local.sh
          bash -n script/install_or_update.sh
          bash -n script/check_public_repo.sh

      - name: Validate updater entrypoint
        run: ./tests/updater_cli.test.sh

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      - name: Build
        run: swift build -c debug --product DeskPet
