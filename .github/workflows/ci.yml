name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Public repository checks
        run: ./script/check_public_repo.sh

      - name: Validate GAS Gateway contract
        run: |
          node --check GAS/DeskPet_GAS_API_Gateway_v3.js
          node tests/gateway_contract.test.js

      - name: Validate shell scripts
        run: |
          bash -n script/build_and_run.sh
          bash -n script/build_release.sh
          bash -n script/install_local.sh
          bash -n script/install_or_update.sh
          bash -n script/check_public_repo.sh
          bash -n tests/desktop_interaction_contract.test.sh
          bash -n tests/rc1_1_2_contract.test.sh
          bash -n tests/rc1_1_3_polish_contract.test.sh

      - name: Validate updater entrypoint
        run: ./tests/updater_cli.test.sh

      - name: Validate updater hand-off
        run: ./tests/update_progress_contract.test.sh

      - name: Validate RC1.1.2 integration contract
        run: bash tests/rc1_1_2_contract.test.sh

      - name: Validate RC1.1.3 desktop polish contract
        run: bash tests/rc1_1_3_polish_contract.test.sh

      - name: Validate administrative-title UI
        run: ./tests/administrative_title_ui.test.sh

      - name: Validate desktop interaction contract
        run: bash tests/desktop_interaction_contract.test.sh

      - name: Validate app icon
        run: ./tests/app_icon_contract.test.sh

      - name: Validate package manifest
        run: swift package dump-package >/dev/null

      - name: Run Swift unit tests
        run: swift test

      - name: Build and verify app resources
        run: |
          DESKPET_SKIP_LAUNCH=1 ./script/build_and_run.sh
          test -s dist/DeskPet.app/Contents/Resources/pet_idle.png
          test -s dist/DeskPet.app/Contents/Resources/pet_listening.png
          test -s dist/DeskPet.app/Contents/Resources/pet_success.png
          test -s dist/DeskPet.app/Contents/Resources/pet_sleep.png
          test -s dist/DeskPet.app/Contents/Resources/AppIcon.icns
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' dist/DeskPet.app/Contents/Info.plist)" = "AppIcon.icns"
