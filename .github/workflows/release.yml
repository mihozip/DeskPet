name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - Sources/DeskPet/**
      - tests/desktop_interaction_contract.test.sh
      - tests/update_progress_contract.test.sh
      - tests/rc1_1_2_contract.test.sh
      - tests/rc1_1_3_polish_contract.test.sh
      - docs/RC1_1_1_DESKTOP_INTERACTION.md
      - script/build_and_run.sh
      - script/build_release.sh
      - script/install_or_update.sh
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          ZIP_PATH="$RUNNER_TEMP/dist-release/DeskPet-${VERSION}.zip"
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"

          case "$VERSION" in
            1.1.3.1)
              RELEASE_TITLE="DeskPet RC1.1.3.1 — Trash Cleanup Fix"
              ;;
            1.1.3.0)
              RELEASE_TITLE="DeskPet RC1.1.3 — Weekly Updates & Desktop Polish"
              ;;
            1.1.2.0)
              RELEASE_TITLE="DeskPet RC1.1.2 — Safer Handoff & Compact Menu"
              ;;
            1.1.1.1)
              RELEASE_TITLE="DeskPet RC1.1.1.1 — Permission Status Refresh"
              ;;
            1.1.1.0)
              RELEASE_TITLE="DeskPet RC1.1.1 — Desktop Interaction Fix"
              ;;
            1.1.0.0)
              RELEASE_TITLE="DeskPet RC1.1 — Calendar Intelligence"
              ;;
            *)
              RELEASE_TITLE="DeskPet ${VERSION}"
              ;;
          esac

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "ZIP_PATH=$ZIP_PATH"
            echo "NOTES_PATH=$NOTES_PATH"
            echo "RELEASE_TITLE=$RELEASE_TITLE"
            echo "RELEASE_EXISTS=$EXISTS"
          } >> "$GITHUB_ENV"

      - name: Stop if release already exists
        if: env.RELEASE_EXISTS == 'true'
        run: echo "${TAG} already exists; nothing to publish."

      - name: Public repository checks
        if: env.RELEASE_EXISTS != 'true'
        run: |
          set -euo pipefail
          ./script/check_public_repo.sh
          swift package dump-package >/dev/null

      - name: Validate desktop interaction contract
        if: env.RELEASE_EXISTS != 'true'
        run: bash tests/desktop_interaction_contract.test.sh

      - name: Validate updater hand-off
        if: env.RELEASE_EXISTS != 'true'
        run: bash tests/update_progress_contract.test.sh

      - name: Validate RC1.1.2 integration contract
        if: env.RELEASE_EXISTS != 'true'
        run: bash tests/rc1_1_2_contract.test.sh

      - name: Validate RC1.1.3 desktop polish contract
        if: env.RELEASE_EXISTS != 'true'
        run: bash tests/rc1_1_3_polish_contract.test.sh

      - name: Run tests
        if: env.RELEASE_EXISTS != 'true'
        run: swift test

      - name: Build RC package
        if: env.RELEASE_EXISTS != 'true'
        env:
          DESKPET_RELEASE_DIR: ${{ runner.temp }}/dist-release
        run: ./script/build_release.sh

      - name: Prepare release notes
        if: env.RELEASE_EXISTS != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == "1.1.1.0" && -s docs/RC1_1_1_DESKTOP_INTERACTION.md ]]; then
            cat docs/RC1_1_1_DESKTOP_INTERACTION.md > "$NOTES_PATH"
          else
            awk -v version="$VERSION" '
              $0 == "## [" version "] - 2026-08" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "$NOTES_PATH"
          fi

          if [[ ! -s "$NOTES_PATH" ]]; then
            echo "DeskPet ${VERSION}" > "$NOTES_PATH"
          fi

          SHA256="$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')"
          {
            echo
            echo "## Release validation"
            echo
            echo "- GitHub Actions release workflow: PASS"
            echo "- Swift tests: PASS"
            echo "- Desktop interaction contract: PASS"
            echo "- Updater hand-off contract: PASS"
            echo "- RC1.1.2 permission/menu/trash contract: PASS"
            echo "- RC1.1.3 weekly-update/GAS-menu/window-level contract: PASS"
            echo "- Public repository checks: PASS"
            echo "- Release build and codesign verification: PASS"
            echo "- Asset: \`DeskPet-${VERSION}.zip\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo
            echo "> 此 ZIP 使用 ad-hoc 簽章，適合 RC 測試；尚未使用 Apple Developer ID 簽署或 notarize。"
          } >> "$NOTES_PATH"

      - name: Publish GitHub Release
        if: env.RELEASE_EXISTS != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_PATH" \
            --prerelease
