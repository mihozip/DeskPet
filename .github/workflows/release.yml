name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION
      - CHANGELOG.md
      - Sources/DeskPet/**
      - tests/desktop_interaction_contract.test.sh
      - tests/update_progress_contract.test.sh
      - tests/rc1_1_2_contract.test.sh
      - tests/rc1_1_3_polish_contract.test.sh
      - tests/rc1_2_1_context_briefing_contract.test.sh
      - tests/rc1_3_waiting_intelligence_contract.test.sh
      - tests/rc1_4_waiting_ai_context_contract.test.sh
      - tests/apple_permission_contract.test.sh
      - tests/gemini_model_contract.test.sh
      - docs/RC1_1_1_DESKTOP_INTERACTION.md
      - docs/RC1_2_WORK_CONTEXT.md
      - docs/RC1_2_1_CONTEXT_BRIEFING.md
      - docs/RC1_3_WAITING_INTELLIGENCE.md
      - docs/RC1_4_WAITING_AI_CONTEXT.md
      - script/build_and_run.sh
      - script/build_release.sh
      - script/install_or_update.sh
      - script/resolve_codesign_identity.sh
      - .github/workflows/release.yml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          ZIP_PATH="$RUNNER_TEMP/dist-release/DeskPet-${VERSION}.zip"
          NOTES_PATH="$RUNNER_TEMP/release-notes.md"

          case "$VERSION" in
            1.4.0.0)
              RELEASE_TITLE="DeskPet RC1.4 — Waiting Intelligence + AI Context"
              ;;
            1.3.0.0)
              RELEASE_TITLE="DeskPet RC1.3 — Waiting Intelligence"
              ;;
            1.2.1.1)
              RELEASE_TITLE="DeskPet RC1.2.1.1 — Task Mutation Hotfix"
              ;;
            1.2.1.0)
              RELEASE_TITLE="DeskPet RC1.2.1 — Context Briefing"
              ;;
            1.2.0.0)
              RELEASE_TITLE="DeskPet RC1.2 — Work Context"
              ;;
            1.1.3.3)
              RELEASE_TITLE="DeskPet RC1.1.3.3 — Gemini 3 Model Refresh"
              ;;
            1.1.3.2)
              RELEASE_TITLE="DeskPet RC1.1.3.2 — EventKit Permission State Fix"
              ;;
            1.1.3.1)
              RELEASE_TITLE="DeskPet RC1.1.3.1 — Calendar Authorization & Stability"
              ;;
            1.1.3.0)
              RELEASE_TITLE="DeskPet RC1.1.3 — Weekly Updates & Desktop Polish"
              ;;
            1.1.2.0)
              RELEASE_TITLE="DeskPet RC1.1.2 — Safer Handoff & Compact Menu"
              ;;
            1.1.1.1)
              RELEASE_TITLE="DeskPet RC1.1.1.1 — Permission Status Refresh"
              ;;
            1.1.1.0)
              RELEASE_TITLE="DeskPet RC1.1.1 — Desktop Interaction Fix"
              ;;
            1.1.0.0)
              RELEASE_TITLE="DeskPet RC1.1 — Calendar Intelligence"
              ;;
            *)
              RELEASE_TITLE="DeskPet ${VERSION}"
              ;;
          esac

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            EXISTS=true
          else
            EXISTS=false
          fi

          REFRESH_REQUESTED=false
          if git log -1 --pretty=%B | grep -q '\[refresh-release\]'; then
            REFRESH_REQUESTED=true
          fi

          if [[ "$EXISTS" == "false" || "$REFRESH_REQUESTED" == "true" ]]; then
            SHOULD_PUBLISH=true
          else
            SHOULD_PUBLISH=false
          fi

          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "ZIP_PATH=$ZIP_PATH"
            echo "NOTES_PATH=$NOTES_PATH"
            echo "RELEASE_TITLE=$RELEASE_TITLE"
            echo "RELEASE_EXISTS=$EXISTS"
            echo "REFRESH_REQUESTED=$REFRESH_REQUESTED"
            echo "SHOULD_PUBLISH=$SHOULD_PUBLISH"
          } >> "$GITHUB_ENV"

      - name: Skip unchanged existing release
        if: env.SHOULD_PUBLISH != 'true'
        run: echo "${TAG} already exists and no explicit same-version refresh was requested."

      - name: Public repository checks
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          ./script/check_public_repo.sh
          swift package dump-package >/dev/null

      - name: Validate desktop interaction contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/desktop_interaction_contract.test.sh

      - name: Validate updater hand-off
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/update_progress_contract.test.sh

      - name: Validate RC1.1.2 permission/menu contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/rc1_1_2_contract.test.sh

      - name: Validate RC1.1.3 desktop polish contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/rc1_1_3_polish_contract.test.sh

      - name: Validate RC1.2.1 Context Briefing contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/rc1_2_1_context_briefing_contract.test.sh

      - name: Validate RC1.3 Waiting Intelligence contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/rc1_3_waiting_intelligence_contract.test.sh

      - name: Validate RC1.4 Waiting AI Context contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/rc1_4_waiting_ai_context_contract.test.sh

      - name: Validate Apple permission and signing contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/apple_permission_contract.test.sh

      - name: Validate Gemini model contract
        if: env.SHOULD_PUBLISH == 'true'
        run: bash tests/gemini_model_contract.test.sh

      - name: Run tests
        if: env.SHOULD_PUBLISH == 'true'
        run: swift test

      - name: Build RC package
        if: env.SHOULD_PUBLISH == 'true'
        env:
          DESKPET_RELEASE_DIR: ${{ runner.temp }}/dist-release
        run: ./script/build_release.sh

      - name: Prepare release notes
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == "1.4.0.0" && -s docs/RC1_4_WAITING_AI_CONTEXT.md ]]; then
            cat docs/RC1_4_WAITING_AI_CONTEXT.md > "$NOTES_PATH"
          elif [[ "$VERSION" == "1.3.0.0" && -s docs/RC1_3_WAITING_INTELLIGENCE.md ]]; then
            cat docs/RC1_3_WAITING_INTELLIGENCE.md > "$NOTES_PATH"
          elif [[ "$VERSION" == "1.2.1.0" && -s docs/RC1_2_1_CONTEXT_BRIEFING.md ]]; then
            cat docs/RC1_2_1_CONTEXT_BRIEFING.md > "$NOTES_PATH"
          elif [[ "$VERSION" == "1.1.1.0" && -s docs/RC1_1_1_DESKTOP_INTERACTION.md ]]; then
            cat docs/RC1_1_1_DESKTOP_INTERACTION.md > "$NOTES_PATH"
          else
            awk -v version="$VERSION" '
              $0 == "## [" version "] - 2026-08" { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md > "$NOTES_PATH"
          fi

          if [[ "$VERSION" == "1.1.3.1" ]]; then
            FILTERED_NOTES="$RUNNER_TEMP/release-notes-filtered.md"
            grep -viE 'trash|垃圾桶' "$NOTES_PATH" > "$FILTERED_NOTES" || true
            mv "$FILTERED_NOTES" "$NOTES_PATH"
          fi

          if [[ ! -s "$NOTES_PATH" ]]; then
            echo "DeskPet ${VERSION}" > "$NOTES_PATH"
          fi

          SHA256="$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')"
          {
            echo
            echo "## Release validation"
            echo
            echo "- GitHub Actions release workflow: PASS"
            echo "- Swift tests, including task-mutation, Waiting Intelligence and AI Context regression tests: PASS"
            echo "- RC1.4 Waiting AI Context contract: PASS"
            echo "- RC1.3 Waiting Intelligence contract: PASS"
            echo "- RC1.2.1 Context Briefing contract: PASS"
            echo "- Desktop interaction contract: PASS"
            echo "- Updater hand-off contract: PASS"
            echo "- RC1.1.2 permission/menu contract: PASS"
            echo "- RC1.1.3 weekly-update/GAS-menu/window-level contract: PASS"
            echo "- Apple permission/TCC-signing contract: PASS"
            echo "- Gemini model contract: PASS"
            echo "- Public repository checks: PASS"
            echo "- Release build and codesign verification: PASS"
            echo "- Asset: \`DeskPet-${VERSION}.zip\`"
            echo "- SHA-256: \`${SHA256}\`"
            echo
            echo "> GitHub-hosted RC ZIP 在尚未配置 Developer ID 憑證前仍使用 ad-hoc 簽章。macOS 可能在不同 build 間要求重新確認 TCC 權限；本機 build / source updater 會優先使用 Keychain 中可用的 Developer ID 或 Apple Development 簽章。"
          } >> "$NOTES_PATH"

      - name: Publish or refresh GitHub Release
        if: env.SHOULD_PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_EXISTS" == "true" ]]; then
            gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null

            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_PATH" \
              --prerelease
            gh release upload "$TAG" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" "$ZIP_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES_PATH" \
              --prerelease
          fi
